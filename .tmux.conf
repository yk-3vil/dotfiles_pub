# tmux 設定ファイル

#===============================================================================
# シェル設定
#===============================================================================

set-option -g default-shell "$SHELL"
set -g default-command "$SHELL"

#===============================================================================
# ターミナル・表示設定
#===============================================================================

# 256色・True Color 対応
set-option default-terminal tmux-256color
set-option -a terminal-overrides $TERM:RGB

#===============================================================================
# 入力・操作設定
#===============================================================================

# マウス操作を有効化
set-option -g mouse on

# Prefix キーを C-b → C-j に変更
unbind-key C-b
set-option -g prefix C-j
bind-key C-j send-prefix

#===============================================================================
# キーバインド
#===============================================================================

# ペイン最大化トグル
bind -n C-z resize-pane -Z

# 設定リロード
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Prefix + | ウィンドウ垂直分割、分割元のディレクトリに移動、自動的にリサイズ
bind | split-window -h -c '#{pane_current_path}' \; select-layout even-horizontal

# Prefix + - ウィンドウ水平分割、分割元のディレクトリに移動、自動的にリサイズ
bind - split-window -v -c '#{pane_current_path}' \; select-layout even-vertical

# ペイン同期 ON/OFF
bind S setw synchronize-panes \; display "synchronize-panes #{?pane_synchronized,on,off}"

#===============================================================================
# ウィンドウ設定
#===============================================================================

# インデックスを 1 から開始
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウ番号の自動リナンバリング
set-option -g renumber-windows on

#===============================================================================
# ペイン表示設定
#===============================================================================

# 非アクティブペインの境界線（暗いグレー）
set -g pane-border-style 'fg=colour238'

# アクティブペインの境界線（明るい青・太字で強調）
set -g pane-active-border-style 'fg=colour33,bold'

# 非アクティブペインの背景を僅かに暗くして区別
set -g window-style 'fg=colour247,bg=colour234'
set -g window-active-style 'fg=colour255,bg=colour232'

# 各ペインの上端に番号・実行コマンドを表示し、アクティブを明示
set -g pane-border-status top
set -g pane-border-format ' #P:#{pane_current_command} #{?pane_active,#[fg=colour33][active]#[default],} '

#===============================================================================
# ステータスバー
#===============================================================================

# status-rightを非表示にする
set -g status-right ""

# ウィンドウステータスの色指定
setw -g window-status-format '#[bg=colour2,fg=colour0] #I #W #[default]'

# アクティブなウィンドウの色指定
# 同期中は[SYNCING]と表示
setw -g window-status-current-format '#{?#{&&:#{client_prefix},#{pane_synchronized}},#[bg=colour160],#{?client_prefix,#[bg=colour12],#{?pane_synchronized,#[bg=colour153],#[bg=colour22]}}}#[fg=colour0]#I #W#{?pane_synchronized, [SYNCING],} #[default]'
